<div class="pnlf-page-header">
  <div>
    <p class="text-eyebrow">Administration</p>
    <h1 class="pnlf-page-header__title">Rapports &amp; exports</h1>
    <p class="pnlf-page-header__subtitle">
      Générez des extractions des lots de traçabilité pour vos rapports institutionnels.
    </p>
  </div>
</div>

<pnlf-card title="Export des lots de produits" subtitle="Périmètre : ensemble des lots visibles selon votre profil">
  <div class="rapports-actions">
    <button pnlfButton variant="outline" [loading]="downloading() === 'csv'" (click)="download('csv')">Export CSV</button>
    <button pnlfButton variant="outline" [loading]="downloading() === 'xlsx'" (click)="download('xlsx')">Export Excel (XLSX)</button>
    <button pnlfButton variant="outline" [loading]="downloading() === 'pdf'" (click)="download('pdf')">Export PDF</button>
  </div>
</pnlf-card>
