@if (!hasChoice()) {
  <div class="cookie-consent" role="dialog" aria-modal="false" aria-label="Consentement aux cookies">
    <div class="cookie-consent__inner">
      <p class="cookie-consent__text">
        Nous utilisons uniquement des cookies techniques essentiels (connexion, préférences, sécurité)
        nécessaires au fonctionnement de la plateforme PNLF-PFNL. Aucun cookie publicitaire n'est déposé.
        Consultez notre <a routerLink="/politique-cookies">politique de cookies</a> pour en savoir plus.
      </p>
      <div class="cookie-consent__actions">
        <button pnlfButton variant="outline" size="sm" type="button" (click)="acceptEssentialOnly()">
          Essentiels uniquement
        </button>
        <button pnlfButton variant="primary" size="sm" type="button" (click)="acceptAll()">
          Tout accepter
        </button>
      </div>
    </div>
  </div>
}
