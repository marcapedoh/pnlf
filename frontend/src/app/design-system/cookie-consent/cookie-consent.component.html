@if (!hasChoice()) {
  <div class="cookie-consent" role="region" aria-label="Information sur les cookies">
    <div class="cookie-consent__inner">
      <p class="cookie-consent__text">
        Ce site n'utilise que des cookies techniques indispensables (connexion, sécurité).
        <a routerLink="/politique-cookies">En savoir plus</a>
      </p>
      <button pnlfButton variant="gold" size="sm" type="button" (click)="acknowledge()">
        J'ai compris
      </button>
    </div>
  </div>
}
