@if (state().open) {
  <div class="pdf-preview" (click)="onBackdropClick($event)">
    <div class="pdf-preview__panel" role="dialog" aria-modal="true" [attr.aria-label]="state().title">
      <header class="pdf-preview__header">
        <div class="pdf-preview__title">
          <pnlf-icon name="file-text" [size]="18" />
          <span>{{ state().title }}</span>
        </div>
        <div class="pdf-preview__actions">
          @if (state().objectUrl) {
            <button pnlfButton variant="secondary" size="sm" type="button" (click)="download()">
              <pnlf-icon name="download" [size]="16" />
              Télécharger
            </button>
          }
          <button class="pdf-preview__close" type="button" aria-label="Fermer l'aperçu" (click)="close()">
            <pnlf-icon name="x" [size]="18" />
          </button>
        </div>
      </header>

      <div class="pdf-preview__body">
        @if (state().loading) {
          <div class="pdf-preview__status">
            <pnlf-spinner />
            <p>Préparation du PDF…</p>
          </div>
        } @else if (state().error) {
          <div class="pdf-preview__status pdf-preview__status--error">
            <pnlf-icon name="alert-triangle" [size]="28" />
            <p>{{ state().error }}</p>
            <button pnlfButton variant="outline" size="sm" type="button" (click)="close()">Fermer</button>
          </div>
        } @else if (safeUrl()) {
          <iframe
            [src]="safeUrl()"
            class="pdf-preview__frame"
            title="Aperçu PDF"
            sandbox="allow-same-origin allow-scripts"
          ></iframe>
        }
      </div>
    </div>
  </div>
}
