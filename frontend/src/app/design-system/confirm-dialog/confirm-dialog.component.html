@if (open()) {
  <div class="pnlf-dialog-backdrop" (click)="onBackdrop($event)" role="presentation">
    <div
      class="pnlf-dialog"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="message() ? messageId : null"
      (keydown)="onKeydown($event)"
    >
      <h2 [id]="titleId" class="pnlf-dialog__title">{{ title() }}</h2>
      @if (message()) {
        <p [id]="messageId" class="pnlf-dialog__message">{{ message() }}</p>
      }
      @if (showInput()) {
        <label class="pnlf-dialog__field">
          <span>{{ inputLabel() }}@if (inputRequired()) { <abbr title="obligatoire">*</abbr> }</span>
          <textarea
            class="pnlf-dialog__textarea"
            [placeholder]="inputPlaceholder()"
            [value]="inputValue()"
            [required]="inputRequired()"
            (input)="inputValue.set($any($event.target).value)"
            rows="4"
          ></textarea>
          @if (inputHint()) {
            <small>{{ inputHint() }}</small>
          }
        </label>
      }
      <div class="pnlf-dialog__actions">
        <button pnlfButton type="button" variant="ghost" data-autofocus (click)="onCancel()" [disabled]="loading()">
          {{ cancelLabel() }}
        </button>
        <button
          pnlfButton
          type="button"
          [variant]="danger() ? 'danger' : 'primary'"
          [loading]="loading()"
          [disabled]="inputRequired() && !inputValue().trim()"
          (click)="onConfirm()"
        >
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
