<div class="pnlf-field" [class.pnlf-field--error]="!!errorMessage()" [class.pnlf-field--disabled]="disabled()">
  @if (label()) {
    <label [for]="id" class="pnlf-field__label">
      {{ label() }}
      @if (required()) {
        <span class="pnlf-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="pnlf-field__control pnlf-select-control">
    <select
      [id]="id"
      [attr.name]="name() || null"
      [value]="value()"
      [disabled]="disabled()"
      [required]="required()"
      [attr.aria-label]="label() ? null : ariaLabel() || placeholder()"
      [attr.aria-invalid]="!!errorMessage()"
      [attr.aria-describedby]="errorMessage() ? id + '-error' : hint() ? id + '-hint' : null"
      (change)="handleChange($event)"
      (blur)="handleBlur()"
    >
      <option value="" [disabled]="required()">{{ placeholder() }}</option>
      @for (opt of options(); track opt.value) {
        <option [value]="opt.value" [selected]="opt.value === value()">{{ opt.label }}</option>
      }
    </select>
  </div>

  @if (errorMessage()) {
    <p [id]="id + '-error'" class="pnlf-field__error" role="alert">{{ errorMessage() }}</p>
  } @else if (hint()) {
    <p [id]="id + '-hint'" class="pnlf-field__hint">{{ hint() }}</p>
  }
</div>
