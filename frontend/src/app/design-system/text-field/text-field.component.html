<div
  class="pnlf-field"
  [class.pnlf-field--focused]="focused()"
  [class.pnlf-field--error]="!!errorMessage()"
  [class.pnlf-field--disabled]="disabled()"
>
  @if (label()) {
    <label [for]="id" class="pnlf-field__label">
      {{ label() }}
      @if (required()) {
        <span class="pnlf-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="pnlf-field__control">
    @if (icon()) {
      <span class="pnlf-field__icon" aria-hidden="true" [innerHTML]="icon()"></span>
    }

    <input
      [id]="id"
      [type]="effectiveType"
      [placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled()"
      [required]="required()"
      [autocomplete]="autocomplete()"
      [attr.aria-invalid]="!!errorMessage()"
      [attr.aria-describedby]="errorMessage() ? id + '-error' : hint() ? id + '-hint' : null"
      (input)="handleInput($event)"
      (focus)="handleFocus()"
      (blur)="handleBlur()"
    />

    @if (type() === 'password') {
      <button
        type="button"
        class="pnlf-field__toggle"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
      >
        @if (showPassword()) {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path
              d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.83 2.83M6.6 6.7C4.5 8.1 3 10 2 12c1.7 3.9 5.6 7 10 7 1.6 0 3.1-.36 4.4-1M9.9 4.24A10.6 10.6 0 0 1 12 4c4.4 0 8.3 3.1 10 7-1 2.1-2.4 3.9-4.2 5.3"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path
              d="M2 12c1.7-3.9 5.6-7 10-7s8.3 3.1 10 7c-1.7 3.9-5.6 7-10 7s-8.3-3.1-10-7Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
          </svg>
        }
      </button>
    }
  </div>

  @if (errorMessage()) {
    <p [id]="id + '-error'" class="pnlf-field__error" role="alert">{{ errorMessage() }}</p>
  } @else if (hint()) {
    <p [id]="id + '-hint'" class="pnlf-field__hint">{{ hint() }}</p>
  }
</div>
