# Blueprint Render : force le bon contexte Docker (évite Failed après restructuration /backend)
services:
  - type: web
    name: pfnl
    runtime: docker
    plan: starter
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/stats/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,pfnl.onrender.com"
      # Nombre de proxys devant gunicorn (adresse IP client pour throttling et audit)
      - key: DRF_NUM_PROXIES
        value: "1"
      # Médias persistants (Cloudflare R2) : valeurs saisies dans le dashboard Render
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_ENDPOINT_URL
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
