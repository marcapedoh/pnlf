# Netlify — déploiement frontend Angular (publish = sortie browser)
[build]
  base = "frontend"
  command = "npm ci && npm run build -- --configuration=production"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# SPA : toutes les routes renvoient index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers (complète public/_headers)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
