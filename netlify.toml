
# Netlify : déploiement frontend Angular
[build]
  base = "frontend"
  command = "npm ci && npm run build -- --configuration=production"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# SPA : toutes les routes renvoient index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob:  https://merchants-rpg-warming-forecasts.trycloudflare.com; connect-src 'self' https://merchants-rpg-warming-forecasts.trycloudflare.com; frame-src 'self' blob:; object-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
